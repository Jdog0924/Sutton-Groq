<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sutton AI</title>
<style>
:root{--bg:#212121;--side:#171717;--card:#2a2a2a;--bub:#303030;--text:#ececec;--mut:#9b9b9b;--line:#363636;--g:linear-gradient(135deg,#10a37f,#5b8def 60%,#a855f7)}
@media (prefers-color-scheme: light){:root{--bg:#fff;--side:#f7f7f8;--card:#f4f4f5;--bub:#efefef;--text:#1f2023;--mut:#6b6b6b;--line:#e3e3e3}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
#side{width:272px;background:var(--side);display:flex;flex-direction:column;padding:12px;gap:6px;flex-shrink:0;transition:transform .25s}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:6px 8px 10px}
.mark{width:30px;height:30px;border-radius:50%;background:var(--g);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
.nb{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;font-weight:500}
.nb:hover,.ci:hover,.ci.on{background:var(--bub)}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.lab{font-size:12px;color:var(--mut);padding:10px 12px 4px}
.ci{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:10px;font-size:14px;cursor:pointer}
.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .x{opacity:0;color:var(--mut);padding:0 4px}
.ci:hover .x{opacity:1}
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100dvh}
#top{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
#chat{flex:1;overflow-y:auto;padding:24px 16px}
.wrap{max-width:760px;margin:0 auto}
.msg{display:flex;gap:14px;margin:22px 0}
.msg.user{justify-content:flex-end}
.av{width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0;margin-top:2px}
.col{min-width:0;max-width:calc(100% - 44px)}
.user .col{max-width:85%}
.bub{white-space:pre-wrap;word-wrap:break-word}
.user .bub{background:var(--bub);padding:10px 18px;border-radius:22px}
.cp{font-size:12px;color:var(--mut);margin-top:6px}
.cp:hover{color:var(--text)}
pre{background:#0d0d0d;color:#eee;padding:14px;border-radius:12px;overflow-x:auto;white-space:pre;font-size:14px}
code{background:var(--bub);padding:1px 6px;border-radius:6px;font-size:.9em}
pre code{background:none;padding:0}
#hero{text-align:center;margin-top:10vh}
#hero .mark{width:56px;height:56px;font-size:26px;margin:0 auto 18px}
#hero h2{font-size:32px;margin:0 0 6px;font-weight:650}
#hero p{color:var(--mut);margin:0 0 28px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.4}
.card:hover{background:var(--bub)}
.card b{display:block;margin-bottom:2px}
.card span{color:var(--mut)}
#bar{padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px))}
#box{max-width:760px;margin:0 auto;background:var(--bub);border:1px solid var(--line);border-radius:28px;display:flex;align-items:flex-end;padding:8px 8px 8px 8px}
textarea{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;resize:none;max-height:200px;padding:8px 0}
#prev{max-width:760px;margin:0 auto 8px;display:flex;gap:8px;flex-wrap:wrap;padding:0 4px}
#prev:empty{display:none}
.th{position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:1}
#attach{width:38px;height:38px;border-radius:50%;font-size:24px;color:var(--mut);flex-shrink:0;margin-right:6px}
#attach:hover{color:var(--text);background:var(--card)}
.uimgs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:6px}
.uimgs img{max-width:200px;max-height:200px;border-radius:14px;display:block}
#mic{width:38px;height:38px;border-radius:50%;color:var(--mut);flex-shrink:0;margin-right:4px;display:grid;place-items:center}
#mic:hover{color:var(--text);background:var(--card)}
#mic.on{background:#e5484d;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(229,72,77,.25)}}
#send{width:38px;height:38px;border-radius:50%;background:var(--g);color:#fff;font-size:18px;font-weight:700}
#send:disabled{opacity:.35;cursor:default}
#note{text-align:center;color:var(--mut);font-size:12px;margin-top:8px}
.dots i{display:inline-block;width:7px;height:7px;margin:8px 2px;border-radius:50%;background:var(--mut);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.2}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#mbox{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:460px;max-height:80vh;display:flex;flex-direction:column;gap:10px}
#mbox h3{margin:0}
#mbox p{margin:0;color:var(--mut);font-size:14px}
#mlist{overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.mi{display:flex;justify-content:space-between;gap:10px;background:var(--card);padding:8px 12px;border-radius:10px;font-size:14px}
.mi button{color:var(--mut)}
.mrow{display:flex;gap:8px}
.mrow input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--text);font:inherit;outline:0}
.btn{background:var(--g);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600}
.btn2{background:var(--card);border-radius:10px;padding:8px 14px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
#toast.show{opacity:1}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19}
@media (max-width:760px){
  #side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%)}
  #side.open{transform:none}
  #top{display:flex}
  .cards{grid-template-columns:1fr}
  #hero{margin-top:4vh}
}
</style>
</head>
<body>
<aside id="side">
  <div class="logo"><div class="mark">S</div>Sutton AI</div>
  <button class="nb" id="newb">+ New chat</button>
  <div id="list"></div>
  <button class="nb" id="memb">Memory</button>
</aside>
<div id="ov"></div>
<div id="main">
  <div id="top"><button id="menu">&#9776;</button><span id="title">Sutton AI</span></div>
  <div id="chat"><div class="wrap" id="log"></div></div>
  <div id="bar">
    <div id="prev"></div>
    <div id="box"><button id="attach" title="Add photos">+</button><input type="file" id="file" accept="image/*" multiple hidden><textarea id="in" rows="1" placeholder="Message Sutton AI"></textarea><button id="mic" title="Voice input"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg></button><button id="send" disabled>&#8593;</button></div>
    <div id="note">Sutton AI can make mistakes. Double check important info.</div>
  </div>
</div>
<div id="modal"><div id="mbox">
  <h3>Memory</h3>
  <p>Sutton AI saves lasting facts you share. They stay in this browser, and you can delete any of them.</p>
  <div id="mlist"></div>
  <div class="mrow"><input id="madd" placeholder="Add something to remember"><button class="btn" id="maddb">Add</button></div>
  <div class="mrow"><button class="btn2" id="mclear">Clear all</button><button class="btn2" id="mclose">Close</button></div>
</div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id),log=$("log"),inp=$("in"),send=$("send"),chat=$("chat");
const CARDS=[["Explain something","Break down a tricky topic simply","Explain how compound interest works in simple terms"],["Write for me","Draft an email, essay, or post","Help me write a professional email asking for a meeting"],["Plan it out","Build a schedule or step-by-step plan","Help me plan a productive weekly schedule"],["Fix my code","Debug or write a script","Write a Python script that renames all files in a folder"]];
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
let chats=load("sutton_chats",[]).filter(c=>c.msgs&&c.msgs.length),mem=load("sutton_mem",[]),cur=null,busy=false;
function save(){try{localStorage.setItem("sutton_chats",JSON.stringify(chats.map(c=>({...c,msgs:c.msgs.map(m=>{const {full,...r}=m;return r})}))));localStorage.setItem("sutton_mem",JSON.stringify(mem))}catch(e){}}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(t){return esc(t).split("```").map((p,i)=>i%2?"<pre><code>"+p.replace(/^\w*\n/,"")+"</code></pre>":p.replace(/^#{1,6} (.+)$/gm,"<b>$1</b>").replace(/^[ \t]*[-*] /gm,"\u2022 ").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")).join("")}
function toast(t){const e=$("toast");e.textContent=t;e.className="show";setTimeout(()=>e.className="",2200)}
function closeSide(){$("side").classList.remove("open");$("ov").style.display="none"}
function renderList(){
  const l=$("list");l.innerHTML="";
  if(chats.length){const b=document.createElement("div");b.className="lab";b.textContent="Chats";l.appendChild(b)}
  chats.forEach(c=>{
    const d=document.createElement("div");d.className="ci"+(cur===c?" on":"");
    const s=document.createElement("span");s.textContent=c.title;
    const x=document.createElement("button");x.className="x";x.textContent="\u00d7";x.title="Delete";
    x.onclick=e=>{e.stopPropagation();chats=chats.filter(k=>k!==c);if(cur===c)cur=null;save();render()};
    d.onclick=()=>{cur=c;render();closeSide()};
    d.append(s,x);l.appendChild(d);
  });
}
function hero(){
  log.innerHTML='<div id="hero"><div class="mark">S</div><h2>What can I help with?</h2><p>Ask me anything, or pick one to start.</p><div class="cards">'+CARDS.map((c,i)=>'<button class="card" data-i="'+i+'"><b>'+c[0]+'</b><span>'+c[1]+'</span></button>').join("")+'</div></div>';
  log.querySelectorAll(".card").forEach(b=>b.onclick=()=>{inp.value=CARDS[b.dataset.i][2];go()});
}
function add(role,html){
  const d=document.createElement("div");d.className="msg "+role;
  if(role==="assistant"){const a=document.createElement("div");a.className="av";a.textContent="S";d.appendChild(a)}
  const c=document.createElement("div");c.className="col";
  const b=document.createElement("div");b.className="bub";b.innerHTML=html;
  c.appendChild(b);d.appendChild(c);log.appendChild(d);chat.scrollTop=chat.scrollHeight;
  return {b,c};
}
function addCopy(c,text){
  const k=document.createElement("button");k.className="cp";k.textContent="Copy";
  k.onclick=()=>{try{navigator.clipboard.writeText(text);k.textContent="Copied"}catch(e){}setTimeout(()=>k.textContent="Copy",1500)};
  c.appendChild(k);
}
function render(){
  log.innerHTML="";
  if(!cur||!cur.msgs.length)hero();
  else cur.msgs.forEach(m=>{const r=add(m.role,m.role==="user"?esc(m.content):md(m.content));if(m.thumbs)r.c.insertBefore(imgStrip(m.thumbs),r.b);if(m.role==="assistant")addCopy(r.c,m.content)});
  renderList();$("title").textContent=cur?cur.title:"Sutton AI";
}
function learn(t){
  let n=0;
  t=t.replace(/\[\[remember:\s*([^\]]+?)\s*\]\]/gi,(m,f)=>{f=f.slice(0,200);if(!mem.some(x=>x.toLowerCase()===f.toLowerCase())&&mem.length<40){mem.push(f);n++}return""});
  t=t.replace(/\[\[forget:\s*([^\]]+?)\s*\]\]/gi,(m,k)=>{k=k.toLowerCase();const b=mem.length;mem=mem.filter(x=>!x.toLowerCase().includes(k));if(mem.length<b)toast("Memory updated");return""});
  if(n)toast("Memory saved");
  return t.trim();
}
async function reveal(b,t){
  const w=t.split(/(\s+)/);let s="";
  for(let i=0;i<w.length;i++){s+=w[i];if(i%6===0){b.innerHTML=md(s);chat.scrollTop=chat.scrollHeight;await new Promise(r=>setTimeout(r,10))}}
  b.innerHTML=md(t);chat.scrollTop=chat.scrollHeight;
}
let pending=[];
function imgStrip(th){const d=document.createElement("div");d.className="uimgs";th.forEach(u=>{const i=document.createElement("img");i.src=u;d.appendChild(i)});return d}
function shrink(file,max,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",q))};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("bad image"))};im.src=u})}
async function addFiles(files){
  for(const f of files){
    if(!f.type.startsWith("image/"))continue;
    if(pending.length>=3){toast("Up to 3 photos per message");break}
    try{pending.push({full:await shrink(f,1280,.8),thumb:await shrink(f,160,.6)})}catch(e){toast("Could not read that image")}
  }
  renderPrev();
}
function renderPrev(){
  const p=$("prev");p.innerHTML="";
  pending.forEach((m,i)=>{const d=document.createElement("div");d.className="th";const im=document.createElement("img");im.src=m.thumb;const x=document.createElement("button");x.textContent="\u00d7";x.onclick=()=>{pending.splice(i,1);renderPrev()};d.append(im,x);p.appendChild(d)});
  send.disabled=busy||(!inp.value.trim()&&!pending.length);
}
async function go(){
  const text=inp.value.trim();if((!text&&!pending.length)||busy)return;
  if(listening){rec.onresult=null;try{rec.abort()}catch(e){}}
  const imgs=pending;pending=[];renderPrev();
  if(!cur){cur={id:String(Date.now()),title:(text||"Photo chat").slice(0,40),msgs:[]};chats.unshift(cur)}
  if(!cur.msgs.length)log.innerHTML="";
  busy=true;send.disabled=true;inp.value="";inp.style.height="auto";
  const m={role:"user",content:text||"Describe this image."};
  if(imgs.length){m.thumbs=imgs.map(i=>i.thumb);m.full=imgs.map(i=>i.full)}
  cur.msgs.push(m);
  const ur=add("user",esc(m.content));if(m.thumbs)ur.c.insertBefore(imgStrip(m.thumbs),ur.b);
  renderList();
  const r=add("assistant",'<span class="dots"><i></i><i></i><i></i></span>');
  const keep=new Set(cur.msgs.map((x,i)=>x.full?i:-1).filter(i=>i>=0).slice(-2));
  const payload=cur.msgs.map((x,i)=>keep.has(i)?{role:x.role,content:x.content,images:x.full}:{role:x.role,content:x.thumbs?x.content+" [a photo was attached here]":x.content});
  try{
    const res=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:payload,memory:mem})});
    const d=await res.json();
    if(!res.ok)throw new Error(d.error||"Something went wrong");
    const reply=learn(d.reply)||"Sorry, I could not answer that. Try rephrasing.";
    cur.msgs.push({role:"assistant",content:reply});
    await reveal(r.b,reply);addCopy(r.c,reply);
  }catch(e){r.b.textContent="Error: "+e.message;cur.msgs.pop();inp.value=text;pending=imgs;renderPrev()}
  save();busy=false;renderPrev();renderList();
}
function renderMem(){
  const l=$("mlist");l.innerHTML="";
  if(!mem.length){const p=document.createElement("p");p.textContent='Nothing saved yet. Try saying "remember that I like short answers".';l.appendChild(p)}
  mem.forEach((f,i)=>{
    const d=document.createElement("div");d.className="mi";
    const s=document.createElement("span");s.textContent=f;
    const x=document.createElement("button");x.textContent="\u00d7";x.onclick=()=>{mem.splice(i,1);save();renderMem()};
    d.append(s,x);l.appendChild(d);
  });
}
inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=inp.scrollHeight+"px";renderPrev()});
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go()}});
send.onclick=go;
$("attach").onclick=()=>$("file").click();
$("file").onchange=e=>{addFiles(e.target.files);e.target.value=""};
inp.addEventListener("paste",e=>{const f=[...(e.clipboardData&&e.clipboardData.files||[])];if(f.length){e.preventDefault();addFiles(f)}});
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{e.preventDefault();addFiles(e.dataTransfer.files)});
$("newb").onclick=()=>{cur=null;render();closeSide()};
$("menu").onclick=()=>{$("side").classList.add("open");$("ov").style.display="block"};
$("ov").onclick=closeSide;
$("memb").onclick=()=>{renderMem();$("modal").style.display="flex";closeSide()};
$("mclose").onclick=()=>{$("modal").style.display="none"};
$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").style.display="none"};
$("maddb").onclick=()=>{const v=$("madd").value.trim().slice(0,200);if(v&&mem.length<40){mem.push(v);$("madd").value="";save();renderMem()}};
$("mclear").onclick=()=>{mem=[];save();renderMem()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false,base="";
if(!SR)$("mic").style.display="none";
$("mic").onclick=()=>{
  if(!SR)return;
  if(listening){try{rec.stop()}catch(e){}return}
  rec=new SR();rec.lang=navigator.language||"en-US";rec.interimResults=true;rec.continuous=true;
  base=inp.value&&!/\s$/.test(inp.value)?inp.value+" ":inp.value;
  rec.onstart=()=>{listening=true;$("mic").classList.add("on")};
  rec.onresult=e=>{let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;inp.value=base+t;inp.dispatchEvent(new Event("input"))};
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed")toast("Microphone is blocked. Allow it in your browser settings.");else if(e.error!=="no-speech"&&e.error!=="aborted")toast("Voice input error: "+e.error)};
  rec.onend=()=>{listening=false;$("mic").classList.remove("on");inp.focus()};
  try{rec.start()}catch(e){}
};
render();
</script>
</body>
</html>
