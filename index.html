<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sutton AI</title>
<style>
:root{--bg:#212121;--panel:#171717;--bubble:#2f2f2f;--text:#ececec;--muted:#9b9b9b;--accent:#10a37f}
@media (prefers-color-scheme: light){:root{--bg:#fff;--panel:#f7f7f8;--bubble:#f0f0f0;--text:#202123;--muted:#6b6b6b}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex}
#side{width:260px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px}
#side h1{font-size:18px;margin:6px 8px 10px}
button{font:inherit;cursor:pointer}
#new{background:transparent;color:var(--text);border:1px solid var(--muted);border-radius:10px;padding:10px;text-align:left}
#new:hover{background:var(--bubble)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#chat{flex:1;overflow-y:auto;padding:24px 16px}
.wrap{max-width:720px;margin:0 auto}
.msg{display:flex;margin:18px 0}
.msg.user{justify-content:flex-end}
.bub{max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.user .bub{background:var(--bubble);padding:10px 16px;border-radius:20px}
pre{background:#0d0d0d;color:#eee;padding:12px;border-radius:10px;overflow-x:auto;white-space:pre}
code{background:var(--bubble);padding:1px 5px;border-radius:5px}
pre code{background:none;padding:0}
#hero{text-align:center;margin-top:18vh}
#hero h2{font-size:30px;margin:0 0 8px}
#hero p{color:var(--muted)}
#bar{padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px))}
#box{max-width:720px;margin:0 auto;background:var(--bubble);border-radius:26px;display:flex;align-items:flex-end;padding:8px 8px 8px 18px}
textarea{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;resize:none;max-height:180px;padding:8px 0}
#send{width:36px;height:36px;border-radius:50%;border:0;background:var(--text);color:var(--bg);font-size:18px}
#send:disabled{opacity:.3;cursor:default}
#note{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
.dots span{animation:b 1s infinite;display:inline-block}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.2}}
@media (max-width:700px){#side{display:none}}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<div id="side"><h1>Sutton AI</h1><button id="new">+ New chat</button></div>
<div id="main">
  <div id="chat"><div class="wrap" id="log"></div></div>
  <div id="bar">
    <div id="box"><textarea id="in" rows="1" placeholder="Message Sutton AI"></textarea><button id="send" disabled>&#8593;</button></div>
    <div id="note">Sutton AI can make mistakes. Double check important info.</div>
  </div>
</div>
<script>
const log=document.getElementById("log"),inp=document.getElementById("in"),send=document.getElementById("send"),chat=document.getElementById("chat");
let msgs=[],busy=false;
try{msgs=JSON.parse(localStorage.getItem("sutton")||"[]")}catch(e){}
function save(){try{localStorage.setItem("sutton",JSON.stringify(msgs))}catch(e){}}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function md(t){
  let parts=esc(t).split("```");
  return parts.map((p,i)=>i%2?"<pre><code>"+p.replace(/^\w*\n/,"")+"</code></pre>":
    p.replace(/^#{1,6} (.+)/gm,"<b>1</b>").replace(/^\s*[-*] /gm,"\u2022 ").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")).join("");
}
function mathify(el){
  if(!window.renderMathInElement)return;
  try{renderMathInElement(el,{delimiters:[
    {left:"
",right:"
",display:true},
    {left:"\\[",right:"\\]",display:true},
    {left:"\\(",right:"\\)",display:false},
    {left:"",right:"",display:false}
  ],throwOnError:false})}catch(e){}
}
function add(role,text,raw){
  const d=document.createElement("div");d.className="msg "+role;
  const b=document.createElement("div");b.className="bub";
  b.innerHTML=raw?text:(role==="user"?esc(text):md(text));
  d.appendChild(b);log.appendChild(d);if(role==="assistant"&&!raw)mathify(b);chat.scrollTop=chat.scrollHeight;return b;
}
function hero(){log.innerHTML='<div id="hero"><h2>Sutton AI</h2><p>Ask me anything you want to understand.</p></div>'}
function render(){log.innerHTML="";if(!msgs.length)hero();msgs.forEach(m=>add(m.role,m.content))}
async function go(){
  const text=inp.value.trim();if(!text||busy)return;
  if(!msgs.length)log.innerHTML="";
  busy=true;send.disabled=true;inp.value="";inp.style.height="auto";
  msgs.push({role:"user",content:text});add("user",text);
  const b=add("assistant",'<span class="dots"><span>.</span><span>.</span><span>.</span></span>',true);
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:msgs})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Something went wrong");
    msgs.push({role:"assistant",content:d.reply});b.innerHTML=md(d.reply);mathify(b);
  }catch(e){b.textContent="Error: "+e.message;msgs.pop()}
  save();busy=false;send.disabled=!inp.value.trim();chat.scrollTop=chat.scrollHeight;
}
inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=inp.scrollHeight+"px";send.disabled=busy||!inp.value.trim()});
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go()}});
send.onclick=go;
document.getElementById("new").onclick=()=>{msgs=[];save();render()};
render();
window.addEventListener("load",render);
</script>
</body>
</html>
